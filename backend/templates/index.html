<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GhostNet - The Ghost That Browses Before You. Premium AI-Powered Cybersecurity URL Scanner." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>" />
  <title>GhostNet — The Ghost That Browses Before You</title>

  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Axios CDN -->
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Poppins', 'sans-serif'],
            mono: ['Space Grotesk', 'monospace'],
          },
          colors: {
            ghost: {
              bg: '#000000',
              card: '#0a0a0a',
              accent: '#8B5CF6',
              accentSec: '#3B82F6',
              success: '#22C55E',
              warning: '#F59E0B',
              danger: '#EF4444',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #000000;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.04) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.04) 0%, transparent 40%);
      background-attachment: fixed;
      color: #f8fafc;
      overflow-x: hidden;
    }

    .glass-panel {
      background: rgba(10, 10, 10, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .glass-panel-glow {
      background: rgba(5, 5, 5, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(139, 92, 246, 0.2);
      box-shadow: 
        0 8px 32px 0 rgba(0, 0, 0, 0.5),
        0 0 20px 0 rgba(139, 92, 246, 0.05);
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    .animate-float {
      animation: float 4s ease-in-out infinite;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f2937;
      border-radius: 4px;
      border: 2px solid #000000;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3b82f6;
    }
  </style>
</head>
<body class="antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- ICON MAPPER TO PREVENT IMPORTS ERRORS ---
    const Icon = ({ name, className }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });
      return <i data-lucide={name} className={className}></i>;
    };

    // --- GHOST CHARACTER COMPONENT ---
    const GhostCharacter = ({ state = 'idle', size = 120 }) => {
      let glowColor = 'rgba(139, 92, 246, 0.4)';
      let bodyColor = '#F8FAFC';
      let eyeColor = '#0F172A';
      
      if (state === 'scanning') {
        glowColor = 'rgba(59, 130, 246, 0.6)';
      } else if (state === 'safe') {
        glowColor = 'rgba(34, 197, 94, 0.5)';
      } else if (state === 'warning') {
        glowColor = 'rgba(245, 158, 11, 0.5)';
      } else if (state === 'danger') {
        glowColor = 'rgba(239, 68, 68, 0.6)';
      }

      const renderFace = () => {
        switch (state) {
          case 'scanning':
            return (
              <g>
                <circle cx="42" cy="46" r="4.5" fill={eyeColor} />
                <circle cx="58" cy="46" r="4.5" fill={eyeColor} />
                <line x1="38" y1="46" x2="46" y2="46" stroke="#3B82F6" strokeWidth="1.5" strokeLinecap="round" />
                <line x1="54" y1="46" x2="62" y2="46" stroke="#3B82F6" strokeWidth="1.5" strokeLinecap="round" />
                <path d="M 47 54 Q 50 52 53 54" stroke={eyeColor} strokeWidth="2.5" strokeLinecap="round" fill="none" />
              </g>
            );
          case 'safe':
            return (
              <g>
                <path d="M 38 48 Q 42 43 46 48" stroke={eyeColor} strokeWidth="3" strokeLinecap="round" fill="none" />
                <path d="M 54 48 Q 58 43 62 48" stroke={eyeColor} strokeWidth="3" strokeLinecap="round" fill="none" />
                <path d="M 46 54 Q 50 58 54 54" stroke={eyeColor} strokeWidth="2.5" strokeLinecap="round" fill="none" />
              </g>
            );
          case 'warning':
          case 'danger':
            return (
              <g>
                <path d="M 38 44 L 46 47" stroke={eyeColor} strokeWidth="3" strokeLinecap="round" />
                <path d="M 62 44 L 54 47" stroke={eyeColor} strokeWidth="3" strokeLinecap="round" />
                <circle cx="42" cy="48" r="4" fill={eyeColor} />
                <circle cx="58" cy="48" r="4" fill={eyeColor} />
                <path d="M 46 56 Q 50 52 54 56" stroke={eyeColor} strokeWidth="2.5" strokeLinecap="round" fill="none" />
              </g>
            );
          case 'idle':
          default:
            return (
              <g>
                <circle cx="40" cy="45" r="4" fill={eyeColor} />
                <circle cx="60" cy="45" r="4" fill={eyeColor} />
                <path d="M 46 53 Q 50 56 54 53" stroke={eyeColor} strokeWidth="2.5" strokeLinecap="round" fill="none" />
              </g>
            );
        }
      };

      return (
        <div className="relative flex items-center justify-center select-none" style={{ width: size, height: size }}>
          <div 
            className="absolute inset-0 rounded-full blur-xl transition-all duration-700 opacity-60"
            style={{ 
              background: glowColor,
              transform: state === 'scanning' ? 'scale(1.15)' : 'scale(1)'
            }}
          />
          
          <svg 
            viewBox="0 0 100 100" 
            className={`w-full h-full relative z-10 transition-all duration-500 ${state === 'scanning' ? 'animate-pulse' : 'animate-float'}`}
          >
            <defs>
              <filter id="ghost-glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
            </defs>

            <path 
              d="M 50 15 C 25 15, 20 40, 20 60 C 20 75, 25 85, 30 85 C 35 85, 37 77, 43 77 C 48 77, 50 85, 55 85 C 60 85, 62 77, 68 77 C 73 77, 75 85, 80 85 C 85 85, 90 75, 90 60 C 90 40, 85 15, 50 15 Z" 
              fill={bodyColor}
              filter="url(#ghost-glow)"
            />

            {renderFace()}

            {(state === 'idle' || state === 'safe') && (
              <g>
                <ellipse cx="34" cy="48" rx="3" ry="1.5" fill="rgba(236, 72, 153, 0.4)" />
                <ellipse cx="66" cy="48" rx="3" ry="1.5" fill="rgba(236, 72, 153, 0.4)" />
              </g>
            )}

            <path d="M 16 54 C 12 54, 8 50, 12 44 C 14 42, 17 45, 18 48" fill="none" stroke={bodyColor} strokeWidth="3.5" strokeLinecap="round" />
            <path d="M 84 54 C 88 54, 92 50, 88 44 C 86 42, 83 45, 82 48" fill="none" stroke={bodyColor} strokeWidth="3.5" strokeLinecap="round" />
          </svg>
        </div>
      );
    };

    // --- TRUST SCORE COMPONENT ---
    const TrustScore = ({ score, riskLevel, size = 180, strokeWidth = 14 }) => {
      const [animatedScore, setAnimatedScore] = useState(0);
      
      useEffect(() => {
        setAnimatedScore(0);
        const duration = 1000;
        const startTime = performance.now();
        let frameId;
        
        const animate = (currentTime) => {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const currentVal = Math.round(progress * score);
          setAnimatedScore(currentVal);
          
          if (progress < 1) {
            frameId = requestAnimationFrame(animate);
          }
        };
        
        frameId = requestAnimationFrame(animate);
        return () => cancelAnimationFrame(frameId);
      }, [score]);

      let color = '#EF4444';
      let shadowGlow = 'rgba(239, 68, 68, 0.3)';

      if (score >= 80) {
        color = '#22C55E';
        shadowGlow = 'rgba(34, 197, 94, 0.3)';
      } else if (score >= 60) {
        color = '#3B82F6';
        shadowGlow = 'rgba(59, 130, 246, 0.3)';
      } else if (score >= 40) {
        color = '#F59E0B';
        shadowGlow = 'rgba(245, 158, 11, 0.3)';
      }

      const radius = (size - strokeWidth) / 2;
      const circumference = radius * 2 * Math.PI;
      const offset = circumference - (animatedScore / 100) * circumference;

      return (
        <div className="relative flex flex-col items-center justify-center" style={{ width: size, height: size }}>
          <div className="absolute inset-2 rounded-full blur-xl opacity-20" style={{ background: color }} />
          
          <svg width={size} height={size} className="transform -rotate-90">
            <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke="#18181b" strokeWidth={strokeWidth} />
            <circle
              cx={size / 2}
              cy={size / 2}
              r={radius}
              fill="none"
              stroke={color}
              strokeWidth={strokeWidth}
              strokeDasharray={circumference}
              strokeDashoffset={offset}
              strokeLinecap="round"
              style={{ transition: 'stroke-dashoffset 0.1s ease-out, stroke 0.5s ease' }}
            />
          </svg>
          
          <div className="absolute flex flex-col items-center justify-center text-center">
            <span className="text-4xl font-bold font-mono tracking-tight" style={{ color: color, textShadow: `0 0 10px ${shadowGlow}` }}>
              {animatedScore}
            </span>
            <span className="text-[10px] uppercase tracking-widest text-slate-400 font-semibold mt-1">Trust Score</span>
            <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full mt-2 border" style={{ borderColor: color + '40', backgroundColor: color + '15', color: color }}>
              {riskLevel}
            </span>
          </div>
        </div>
      );
    };

    // --- CONSEQUENCE VISUALIZER COMPONENT ---
    const ConsequenceVisualizer = ({ consequences, riskLevel }) => {
      const [activeStep, setActiveStep] = useState(0);
      const [simRunning, setSimRunning] = useState(false);

      const reset = () => {
        setActiveStep(0);
        setSimRunning(false);
      };

      const run = () => {
        reset();
        setSimRunning(true);
        let curr = 0;
        const interval = setInterval(() => {
          curr += 1;
          if (curr < consequences.length) {
            setActiveStep(curr);
          } else {
            clearInterval(interval);
            setSimRunning(false);
          }
        }, 1600);
      };

      const getRiskStyles = (risk, isActive) => {
        const isDanger = ['danger', 'critical', 'compromised'].includes(risk.toLowerCase());
        const isWarning = ['warning', 'medium'].includes(risk.toLowerCase());
        
        if (isDanger) {
          return {
            dot: isActive ? 'bg-red-500 ring-4 ring-red-500/30 shadow-[0_0_12px_#ef4444]' : 'bg-red-900/60',
            border: isActive ? 'border-red-500/40 bg-red-950/20' : 'border-red-950/20 bg-transparent',
            badge: 'Danger'
          };
        } else if (isWarning) {
          return {
            dot: isActive ? 'bg-amber-500 ring-4 ring-amber-500/30 shadow-[0_0_12px_#f59e0b]' : 'bg-amber-900/60',
            border: isActive ? 'border-amber-500/40 bg-amber-950/10' : 'border-amber-950/20 bg-transparent',
            badge: 'Warning'
          };
        } else {
          return {
            dot: isActive ? 'bg-green-500 ring-4 ring-green-500/30 shadow-[0_0_12px_#22c55e]' : 'bg-green-900/60',
            border: isActive ? 'border-green-500/40 bg-green-950/10' : 'border-green-950/20 bg-transparent',
            badge: 'Secure'
          };
        }
      };

      const isMalicious = ['high risk', 'critical', 'danger'].includes(riskLevel.toLowerCase());

      return (
        <div className="glass-panel p-6 rounded-2xl border border-zinc-900 bg-black/90 mt-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
              <h3 className="text-lg font-semibold text-slate-100 flex items-center gap-2">
                <Icon name="shield-alert" className={`w-5 h-5 ${isMalicious ? 'text-red-400' : 'text-blue-400'}`} />
                What Happens If I Continue?
              </h3>
              <p className="text-xs text-slate-400 mt-1">An educational threat model tracing the path of interaction with this URL.</p>
            </div>
            
            <div className="flex items-center gap-2">
              {!simRunning && activeStep > 0 && (
                <button onClick={reset} className="flex items-center gap-1 text-xs px-3 py-1.5 rounded-lg border border-zinc-700 bg-zinc-800 text-slate-300 hover:bg-zinc-700 transition-all cursor-pointer">
                  <Icon name="rotate-ccw" className="w-3.5 h-3.5" /> Reset
                </button>
              )}
              <button
                onClick={run}
                disabled={simRunning}
                className={`flex items-center gap-1.5 text-xs px-4 py-2 rounded-lg font-medium transition-all cursor-pointer ${
                  simRunning 
                    ? 'bg-zinc-800 text-slate-500 border border-zinc-700' 
                    : isMalicious ? 'bg-red-500/25 border border-red-500/40 text-red-300 hover:bg-red-500/30' : 'bg-blue-500/25 border border-blue-500/40 text-blue-300 hover:bg-blue-500/30'
                }`}
              >
                <Icon name="play" className="w-3.5 h-3.5" /> {simRunning ? 'Simulating...' : 'Simulate Threat Flow'}
              </button>
            </div>
          </div>

          <div className="relative pl-8 md:pl-0 md:grid md:grid-cols-4 gap-4">
            <div className="hidden md:block absolute top-[18px] left-[12%] right-[12%] h-0.5 bg-zinc-800 z-0">
              <div 
                className={`h-full transition-all duration-700 ${isMalicious ? 'bg-red-500/50' : 'bg-green-500/50'}`}
                style={{ width: `${(activeStep / (consequences.length - 1)) * 100}%` }}
              />
            </div>
            
            <div className="md:hidden absolute top-4 bottom-4 left-[14px] w-0.5 bg-zinc-800 z-0">
              <div 
                className={`h-full transition-all duration-700 ${isMalicious ? 'bg-red-500/50' : 'bg-green-500/50'}`}
                style={{ height: `${(activeStep / (consequences.length - 1)) * 100}%` }}
              />
            </div>

            {consequences.map((c, index) => {
              const isActive = index <= activeStep;
              const isCurrent = index === activeStep;
              const styles = getRiskStyles(c.risk, isActive);
              
              return (
                <div 
                  key={index}
                  onClick={() => !simRunning && setActiveStep(index)}
                  className={`relative z-10 flex flex-col items-start md:items-center text-left md:text-center p-3 rounded-xl border transition-all duration-500 cursor-pointer ${styles.border} ${isCurrent ? 'scale-105 shadow-lg border-zinc-700 bg-zinc-950/30' : 'border-transparent'}`}
                >
                  <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs text-slate-100 mb-3 transition-all duration-500 ${styles.dot}`}>
                    {index + 1}
                  </div>
                  
                  <div className="flex items-center gap-1.5 md:flex-col mt-1">
                    <span className={`text-sm font-semibold transition-colors duration-500 ${isActive ? 'text-slate-100' : 'text-slate-500'}`}>
                      {c.step}
                    </span>
                  </div>

                  <p className={`text-xs mt-2 transition-all duration-500 leading-relaxed ${isActive ? 'text-slate-300' : 'text-slate-600'}`}>
                    {c.description}
                  </p>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    // --- MAIN APP ---
    const SCAN_STEPS = [
      "I am entering the website...",
      "Checking secure connection...",
      "Reading domain information...",
      "Inspecting website structure...",
      "Looking for suspicious patterns...",
      "Generating guardian report..."
    ];

    const App = () => {
      const [url, setUrl] = useState('');
      const [status, setStatus] = useState('landing'); // landing, scanning, results, error
      const [scanStepIndex, setScanStepIndex] = useState(0);
      const [scanResult, setScanResult] = useState(null);
      const [history, setHistory] = useState([]);
      const [errorMessage, setErrorMessage] = useState('');
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [speechLang, setSpeechLang] = useState('hi');

      const formatDomainAge = (days) => {
        if (days === null) return "Unknown Age";
        if (days < 30) return `${days} day${days === 1 ? '' : 's'} old`;
        if (days < 365) {
          const months = Math.floor(days / 30);
          return `${months} month${months === 1 ? '' : 's'} old`;
        }
        const years = Math.floor(days / 365);
        const remainingMonths = Math.floor((days % 365) / 30);
        if (remainingMonths > 0) {
          return `${years} yr${years === 1 ? '' : 's'}, ${remainingMonths} mo${remainingMonths === 1 ? '' : 's'} old`;
        }
        return `${years} year${years === 1 ? '' : 's'} old`;
      };

      const toggleSpeech = (lang) => {
        if ('speechSynthesis' in window) {
          const targetLang = lang || speechLang;
          if (isSpeaking) {
            window.speechSynthesis.cancel();
            setIsSpeaking(false);
          } else {
            const textToSpeak = targetLang === 'en' ? scanResult?.ghost_summary_en : scanResult?.ghost_summary;
            if (textToSpeak) {
              window.speechSynthesis.cancel();
              const utterance = new SpeechSynthesisUtterance(textToSpeak);
              utterance.rate = 0.95;
              utterance.pitch = 1.05;
              
              const voices = window.speechSynthesis.getVoices();
              if (targetLang === 'en') {
                const englishVoice = voices.find(voice => voice.lang.startsWith('en-US')) || 
                                     voices.find(voice => voice.lang.startsWith('en-'));
                if (englishVoice) {
                  utterance.voice = englishVoice;
                }
              } else {
                const hindiVoice = voices.find(voice => 
                  voice.lang === 'hi-IN' || 
                  voice.lang === 'hi' || 
                  voice.lang.startsWith('hi-')
                );
                const defaultVoice = hindiVoice || 
                                     voices.find(voice => voice.lang === 'en-IN') || 
                                     voices.find(voice => voice.lang.startsWith('en-'));
                if (defaultVoice) {
                  utterance.voice = defaultVoice;
                }
              }

              utterance.onstart = () => setIsSpeaking(true);
              utterance.onend = () => setIsSpeaking(false);
              utterance.onerror = () => setIsSpeaking(false);
              window.speechSynthesis.speak(utterance);
            }
          }
        }
      };

      useEffect(() => {
        if (status === 'results' && scanResult && scanResult.ghost_summary) {
          const timer = setTimeout(() => {
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              const textToSpeak = speechLang === 'en' ? scanResult.ghost_summary_en : scanResult.ghost_summary;
              const utterance = new SpeechSynthesisUtterance(textToSpeak || scanResult.ghost_summary);
              utterance.rate = 0.95;
              utterance.pitch = 1.05;
              
              const voices = window.speechSynthesis.getVoices();
              if (speechLang === 'en') {
                const englishVoice = voices.find(voice => voice.lang.startsWith('en-US')) || 
                                     voices.find(voice => voice.lang.startsWith('en-'));
                if (englishVoice) {
                  utterance.voice = englishVoice;
                }
              } else {
                const hindiVoice = voices.find(voice => 
                  voice.lang === 'hi-IN' || 
                  voice.lang === 'hi' || 
                  voice.lang.startsWith('hi-')
                );
                const defaultVoice = hindiVoice || 
                                     voices.find(voice => voice.lang === 'en-IN') || 
                                     voices.find(voice => voice.lang.startsWith('en-'));
                if (defaultVoice) {
                  utterance.voice = defaultVoice;
                }
              }

              utterance.onstart = () => setIsSpeaking(true);
              utterance.onend = () => setIsSpeaking(false);
              utterance.onerror = () => setIsSpeaking(false);
              window.speechSynthesis.speak(utterance);
            }
          }, 600);
          
          return () => {
            clearTimeout(timer);
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
            }
          };
        }
      }, [status, scanResult, speechLang]);

      useEffect(() => {
        fetchHistory();
      }, []);

      const fetchHistory = async () => {
        try {
          const response = await axios.get('/api/history');
          setHistory(response.data);
        } catch (e) {
          const cached = localStorage.getItem('ghostnet_scans_fallback');
          if (cached) setHistory(JSON.parse(cached));
        }
      };

      const handleScan = async (e) => {
        e.preventDefault();
        if (!url.trim()) return;

        setStatus('scanning');
        setScanStepIndex(0);
        setErrorMessage('');

        const stepInterval = setInterval(() => {
          setScanStepIndex(prev => {
            if (prev < SCAN_STEPS.length - 1) return prev + 1;
            clearInterval(stepInterval);
            return prev;
          });
        }, 700);

        try {
          const response = await axios.post('/api/scan', { url });
          const data = response.data;
          
          setTimeout(() => {
            setScanResult(data);
            setStatus('results');
            
            // Save locally
            const cached = localStorage.getItem('ghostnet_scans_fallback');
            let list = cached ? JSON.parse(cached) : [];
            if (!list.some(x => x.id === data.id)) {
              list = [data, ...list].slice(0, 10);
              localStorage.setItem('ghostnet_scans_fallback', JSON.stringify(list));
            }
            fetchHistory();
          }, 3500);
        } catch (err) {
          clearInterval(stepInterval);
          setErrorMessage(err.response?.data?.detail || "Threat exploration failed. Check link structure.");
          setStatus('error');
        }
      };

      const getRiskColor = (level) => {
        switch (level.toLowerCase()) {
          case 'safe': return 'text-green-400 border-green-500/30 bg-green-950/20';
          case 'low risk': return 'text-blue-400 border-blue-500/30 bg-blue-950/20';
          case 'medium risk': return 'text-amber-400 border-amber-500/30 bg-amber-950/20';
          case 'high risk': return 'text-red-400 border-red-500/30 bg-red-950/20';
          default: return 'text-rose-500 border-rose-500/30 bg-rose-950/30';
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <header className="border-b border-zinc-900 bg-black/70 backdrop-blur-md px-6 py-4 flex items-center justify-between">
            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setStatus('landing')}>
              <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-purple-600 to-blue-500 flex items-center justify-center font-bold text-white shadow-lg">👻</div>
              <div>

                          {/* Domain Identity */}
                          <div className="space-y-1">
                            <div className="flex justify-between text-xs font-semibold text-slate-300">
                              <span>Domain Identity & Age</span>
                              <span className="text-emerald-400">{scanResult.scorecard.domain_score} <span className="text-slate-500">/ 25</span></span>
                            </div>
                            <div className="h-1.5 w-full bg-zinc-900 rounded-full overflow-hidden">
                              <div className="h-full bg-emerald-500 rounded-full" style={{ width: `${(scanResult.scorecard.domain_score / 25) * 100}%` }}></div>
                            </div>
                          </div>

                          {/* SSL Connection */}
                          <div className="space-y-1">
                            <div className="flex justify-between text-xs font-semibold text-slate-300">
                              <span>SSL Connection & TLS</span>
                              <span className="text-blue-400">{scanResult.scorecard.ssl_score} <span className="text-slate-500">/ 20</span></span>
                            </div>
                            <div className="h-1.5 w-full bg-zinc-900 rounded-full overflow-hidden">
                              <div className="h-full bg-blue-500 rounded-full" style={{ width: `${(scanResult.scorecard.ssl_score / 20) * 100}%` }}></div>
                            </div>
                            <div className="text-[10px] text-slate-500 font-mono">Issuer: {scanResult.scorecard.ssl_issuer}</div>
                          </div>

                          {/* DOM Safety */}
                          <div className="space-y-1">
                            <div className="flex justify-between text-xs font-semibold text-slate-300">
                              <span>DOM & Form Safety</span>
                              <span className="text-purple-400">{scanResult.scorecard.dom_score} <span className="text-slate-500">/ 25</span></span>
                            </div>
                            <div className="h-1.5 w-full bg-zinc-900 rounded-full overflow-hidden">
                              <div className="h-full bg-purple-500 rounded-full" style={{ width: `${(scanResult.scorecard.dom_score / 25) * 100}%` }}></div>
                            </div>
                            {scanResult.crawled_page_content && (
                              <div className="text-[10px] text-slate-500 font-mono flex flex-wrap gap-x-2">
                                <span>iframes: {scanResult.crawled_page_content.iframes_count || 0}</span>
                                <span>locks: {scanResult.crawled_page_content.copy_paste_locks_detected ? "Yes" : "No"}</span>
                                <span>inline js: {scanResult.crawled_page_content.inline_scripts_length || 0}B</span>
                              </div>
                            )}
                          </div>

                          {/* Security Headers */}
                          <div className="space-y-1">
                            <div className="flex justify-between text-xs font-semibold text-slate-300">
                              <span>HTTP Security Headers</span>
                              <span className="text-amber-400">{scanResult.scorecard.headers_score} <span className="text-slate-500">/ 15</span></span>
                            </div>
                            <div className="h-1.5 w-full bg-zinc-900 rounded-full overflow-hidden">
                              <div className="h-full bg-amber-500 rounded-full" style={{ width: `${(scanResult.scorecard.headers_score / 15) * 100}%` }}></div>
                            </div>
                          </div>

                          {/* Scripts & Redirects */}
                          <div className="space-y-1">
                            <div className="flex justify-between text-xs font-semibold text-slate-300">
                              <span>Scripts & Redirects</span>
                              <span className="text-cyan-400">{scanResult.scorecard.scripts_score} <span className="text-slate-500">/ 15</span></span>
                            </div>
                            <div className="h-1.5 w-full bg-zinc-900 rounded-full overflow-hidden">
                              <div className="h-full bg-cyan-500 rounded-full" style={{ width: `${(scanResult.scorecard.scripts_score / 15) * 100}%` }}></div>
                            </div>
                          </div>
                        </div>
                      </div>
                      
                      {/* Right: Headers Checklist & Threat Assessment QA */}
                      <div className="space-y-4">
                        <div>
                          <h4 className="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-2">HTTP Security Headers</h4>
                          <div className="grid grid-cols-2 gap-2 text-xs font-semibold font-mono">
                            {Object.entries(scanResult.scorecard.security_headers).map(([key, val]) => {
                              if (key === "Server") return null;
                              return (
                                <div key={key} className="flex items-center gap-1.5 bg-zinc-950/40 p-2 rounded-lg border border-zinc-900/60">
                                  {val ? (
                                    <Icon name="check-circle-2" className="w-3.5 h-3.5 text-emerald-400 shrink-0" />
                                  ) : (
                                    <Icon name="alert-triangle" className="w-3.5 h-3.5 text-red-400 shrink-0" />
                                  )}
                                  <span className="truncate text-slate-300 text-[10px]">{key}</span>
                                </div>
                              );
                            })}
                          </div>
                          <div className="text-[10px] text-slate-500 font-mono mt-2 bg-zinc-950/40 p-2 rounded-lg border border-zinc-900/60">
                            Server Banner: <span className="text-slate-300">{scanResult.scorecard.security_headers.Server || "Unknown"}</span>
                          </div>
                        </div>

                        {scanResult.threat_assessment && (
                          <div>
                            <h4 className="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-2">Threat Assessment Checklist</h4>
                            <div className="space-y-2 text-[11px] bg-zinc-950/20 p-3 rounded-xl border border-zinc-900 font-sans">
                              <div className="flex justify-between items-start gap-4">
                                <span className="text-slate-400">Brand Impersonation?</span>
                                <span className={`font-semibold text-right ${scanResult.threat_assessment.is_brand_impersonation.status ? 'text-red-400 animate-pulse' : 'text-green-400'}`} title={scanResult.threat_assessment.is_brand_impersonation.details}>
                                  {scanResult.threat_assessment.is_brand_impersonation.status ? 'Yes' : 'No'}
                                </span>
                              </div>
                              <div className="flex justify-between items-start gap-4 border-t border-zinc-900/40 pt-1.5">
                                <span className="text-slate-400">Resembles Phishing Page?</span>
                                <span className={`font-semibold text-right ${scanResult.threat_assessment.resembles_phishing.status ? 'text-red-400' : 'text-green-400'}`} title={scanResult.threat_assessment.resembles_phishing.details}>
                                  {scanResult.threat_assessment.resembles_phishing.status ? 'Yes' : 'No'}
                                </span>
                              </div>
                              <div className="flex justify-between items-start gap-4 border-t border-zinc-900/40 pt-1.5">
                                <span className="text-slate-400">Unusually New Domain?</span>
                                <span className={`font-semibold text-right ${scanResult.threat_assessment.is_unusually_new.status ? 'text-amber-400' : 'text-green-400'}`} title={scanResult.threat_assessment.is_unusually_new.details}>
                                  {scanResult.threat_assessment.is_unusually_new.status ? 'Yes' : 'No'}
                                </span>
                              </div>
                              <div className="flex justify-between items-start gap-4 border-t border-zinc-900/40 pt-1.5">
                                <span className="text-slate-400">Requesting Sensitive Data?</span>
                                <span className={`font-semibold text-right ${scanResult.threat_assessment.requests_sensitive_info.status ? 'text-red-400' : 'text-green-400'}`} title={scanResult.threat_assessment.requests_sensitive_info.details}>
                                  {scanResult.threat_assessment.requests_sensitive_info.status ? 'Yes' : 'No'}
                                </span>
                              </div>
                              <div className="flex justify-between items-start gap-4 border-t border-zinc-900/40 pt-1.5">
                                <span className="text-slate-400">Confidence Assessment:</span>
                                <span className="text-slate-200 font-semibold" title={scanResult.threat_assessment.confidence_level.details}>
                                  {scanResult.threat_assessment.confidence_level.level}
                                </span>
                              </div>
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}

                <ConsequenceVisualizer consequences={scanResult.consequences} riskLevel={scanResult.risk_level} />

                <div className="glass-panel p-6 rounded-2xl bg-black/60 space-y-4 mt-6">
                  <h3 className="text-sm font-semibold text-slate-100">Guardian Action Plan</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {scanResult.recommendations.map((rec, index) => (
                      <div key={index} className="flex items-start gap-3 p-3 rounded-xl bg-zinc-950/40 border border-zinc-900">
                        <div className={`w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5 ${scanResult.trust_score >= 80 ? 'bg-green-950/30 text-green-400' : 'bg-amber-950/30 text-amber-400'}`}><Icon name="check-circle-2" className="w-3.5 h-3.5" /></div>
                        <span className="text-xs text-slate-300 leading-relaxed font-medium">{rec}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          <footer className="border-t border-zinc-900 bg-black/70 py-6 text-center text-[10px] text-slate-500 font-semibold tracking-wider uppercase">
            👻 GhostNet — The Ghost That Browses Before You.
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
